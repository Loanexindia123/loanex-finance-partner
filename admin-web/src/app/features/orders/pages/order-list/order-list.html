<app-page-header title="Orders" subtitle="All customer orders, full and EMI." />

<div class="toolbar">
  <span class="p-input-icon-left toolbar__search">
    <i class="pi pi-search"></i>
    <input pInputText type="text" placeholder="Search by order ID…" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" />
  </span>
  <p-select [options]="statusOptions" [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event)" optionLabel="label" optionValue="value" placeholder="Status" />
</div>

@if (loading()) {
  <app-loading-skeleton [rows]="6" />
} @else if (error()) {
  <app-error-state [message]="error()!" (retry)="load()" />
} @else if (filtered().length === 0) {
  <app-empty-state icon="pi-shopping-cart" title="No orders found" />
} @else {
  <p-table [value]="filtered()" [paginator]="true" [rows]="20" dataKey="id" styleClass="p-datatable-sm" [rowHover]="true">
    <ng-template pTemplate="header">
      <tr><th>Order</th><th>Amount</th><th>Payment</th><th>Status</th><th>Placed</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-order>
      <tr (click)="view(order)" style="cursor: pointer">
        <td class="mono">{{ order.id }}</td>
        <td>₹{{ order.totalAmount | number }}</td>
        <td><app-status-badge [status]="order.paymentStatus" /></td>
        <td><app-status-badge [status]="order.status" /></td>
        <td>{{ order.createdAt | date: 'medium' }}</td>
      </tr>
    </ng-template>
  </p-table>
}
