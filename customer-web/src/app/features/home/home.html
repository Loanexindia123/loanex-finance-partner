<div class="lx-home">
  <!-- Interactive Hero Carousel & Trust Bar -->
  <app-hero />

  <!-- Top Category Bar -->
  <div id="categories">
    <app-categories />
  </div>

  <!-- Section 1: Hot EMI Deals -->
  <app-popular-products
    title="🔥 Popular on EMI"
    [limit]="6"
  />

  <!-- Category rails — names must match product.category values from the API -->
  <app-popular-products
    title="Air Conditioners"
    category="AC"
    [limit]="6"
  />

  <app-popular-products
    title="Laptops"
    category="Laptop"
    [limit]="6"
  />

  <app-popular-products
    title="Smart TVs"
    category="Smart TV"
    [limit]="6"
  />

  <!-- Section 5: New Arrivals — reuses Popular on EMI featured request (no duplicate HTTP) -->
  <app-popular-products
    title="New Arrivals"
    [limit]="6"
    [reuseFeaturedCache]="true"
  />

  <!-- Snapmint 3-Step EMI Flow -->
  <div id="how-it-works">
    <app-how-it-works />
  </div>

  <!-- Promotional Offer Banner -->
  <div id="offers">
    <app-offer-banner />
  </div>

  <!-- Trust Badges & Guarantee -->
  <app-why-choose-us />

  <!-- Interactive FAQs -->
  <app-faq />
</div>
